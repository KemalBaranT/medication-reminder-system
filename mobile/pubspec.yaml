name: ilac_takip_mobile
description: Hemsireler icin ilac uygulama ve bildirim mobil uygulamasi
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State yonetimi
  provider: ^6.1.2

  # Ag istekleri
  http: ^1.2.2

  # Push bildirim
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Barkod/QR okuma
  mobile_scanner: ^5.2.3
  # Galeriden QR fotografi secimi (bkz. WristbandScanScreen)
  image_picker: ^1.1.2
  # Galeri fotograflari icin goruntu iyilestirme (moire/parlama giderme) ve
  # yerel motorun okuyamadigi goruntulerde yedek saf Dart QR cozucu
  # (bkz. QrImageDecoder)
  image: ^4.10.1
  zxing2: ^0.2.4
  path_provider: ^2.1.6

  # Offline yerel veritabani (senkron kuyrugu)
  sqflite: ^2.4.1
  path: ^1.9.0

  # Baglanti durumu + arka plan senkron
  connectivity_plus: ^6.1.0
  workmanager: ^0.10.10

  # Guvenli token saklama
  flutter_secure_storage: ^9.2.2

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
